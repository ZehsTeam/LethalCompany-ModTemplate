[config]
schemaVersion = "0.0.1"

[package]
namespace = "Zehs"
name = "ModTemplate"
description = "[v81] Your mod description here"
websiteUrl = "https://solo.to/crithaxxog"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./icon.png"
readme = "../../README.md"
outdir = "./Packages"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../ModTemplate/bin/Release/netstandard2.1/com.github.zehsteam.ModTemplate.dll"
target = "BepInEx/plugins/"

[[build.copy]]
source = "../../ModTemplate/bin/Release/netstandard2.1/modtemplate_assets"
target = "BepInEx/plugins/"
